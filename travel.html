<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Travel · Victor Nardi</title>
  <meta name="description" content="A map of places I've been, with photos.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <nav>
    <a href="index.html">Home</a>
    <a href="hobbies.html">Hobbies</a>
    <a href="travel.html" aria-current="page">Travel</a>
  </nav>

  <div class="prose">
    <h1>Travel</h1>
    <p>
      <span id="count">A lot of places</span> so far. Click a country or a dot to
      see where I went and any photos, and drag to move the map around.
    </p>
  </div>

  <div class="travel">
  <div>
  <div class="map-wrap">
    <svg id="map" viewBox="0 0 960 520" role="img" aria-label="World map of places I've been"></svg>
    <div class="tip"></div>
    <div class="zoom">
      <button class="zoom-in" aria-label="Zoom in">+</button>
      <button class="zoom-out" aria-label="Zoom out">−</button>
      <button class="zoom-reset" aria-label="Reset map">⟲</button>
    </div>
  </div>

  <div class="places"></div>
  </div>

  <section id="place" aria-live="polite">
    <p class="meta">Pick a country to see where I went.</p>
  </section>
  </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="lightbox.js"></script>
<script src="travel.js"></script>
</body>
</html>
